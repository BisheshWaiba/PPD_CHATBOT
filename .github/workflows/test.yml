name: Tests

# Runs the whole test suite on every push to main and on every pull request, and once a week.
# The weekly run is for the security check: a new advisory can be published for a package you
# already use without you changing any code.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# The workflow only needs to read the code
permissions:
  contents: read

# A newer push to the same branch makes an older, still-running check pointless
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # If one Node version fails, still see how the other one does
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm ci installs exactly what package-lock.json says and fails if it is out of date
      # with package.json, which is what you want from a check
      - run: npm ci

      # The spec reporter prints one readable line per test in the log
      - run: npm test -- --test-reporter=spec

  mongodb:
    name: Tests on MongoDB
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real MongoDB for the tests that can use one. The tests create and drop their own
    # sutkeri_test_* databases, so nothing else is needed.
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test -- --test-reporter=spec
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fails on any known high or critical vulnerability in the packages the app depends on
      - run: npm audit --audit-level=high
